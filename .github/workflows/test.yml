name: test

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install npm that matches engines
        run: npm install -g npm@11.10.0

      - name: Install dependencies from the lockfile
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test
