name: npm audit

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "17 15 * * 1"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install npm that enforces min-release-age
        run: npm install -g npm@11.10.0

      - name: Install dependencies from the lockfile
        run: npm ci

      - name: Audit advisories and registry signatures
        run: npm run security:check
