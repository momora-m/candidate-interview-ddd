services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: candidate
      POSTGRES_PASSWORD: candidate
      POSTGRES_DB: candidate_interview
    ports:
      - "54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U candidate -d candidate_interview"]
      interval: 5s
      timeout: 5s
      retries: 10
